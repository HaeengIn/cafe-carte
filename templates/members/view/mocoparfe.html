{% extends 'base.html' %}
{% block css %}
    <link rel="stylesheet" href="/static/css/members/mocoparfe.css?v={{ static_version('static/css/members/mocoparfe.css') }}">
{% endblock css %}
{% block body %}
    <div class="profile">
        <span class="info">
            <b>
                모코 파르페
            </b>
            <small>
                Moco Parfe
            </small>
            <p>
                {{ rows.story | safe }}
            </p>
            <span class="position">
                <b>「{{ rows.position }}」</b> of Cafe Carte
            </span>
        </span>
        <div class="image-wrapper">
            <span class="debut-date">
                <span>
                    [ 데뷔일 ]
                </span>
                {{ rows.debut_date }}
            </span>
            <img src="/static/img/members/mocoparfe/portrait.webp" alt="Portrait Image">
        </div>
    </div>
{% endblock body %}
